# ~/.ai-orchestrator/config.yaml
#
# Copiar este archivo a config.yaml y completar con tus credenciales reales.
# config.yaml está en .gitignore — nunca se versiona.

providers:
  claude:
    api_key: "sk-ant-..."
    model: "claude-sonnet-4-6"

  openai:
    api_key: "sk-..."
    model: "gpt-4o"

  deepseek:
    api_key: "sk-..."
    model: "deepseek-v4-flash"

  gemini:
    api_key: "AIza..."
    model: "gemini-2.5-flash"

router:
  # Modelo liviano/barato usado SOLO para decidir el ruteo, no para resolver
  # la tarea en sí. DeepSeek V4-Flash es la opción más económica ($0.14/M tokens).
  # Nota: "deepseek-chat" fue deprecado el 24 jul 2026 — usar "deepseek-v4-flash".
  provider: "deepseek"
  model: "deepseek-v4-flash"
  # Si el router falla o no está disponible, cae a este proveedor por defecto
  fallback_provider: "claude"

defaults:
  # Proveedor a usar si un proyecto no define preferred_models en su context.yaml
  default_provider: "claude"

# Precio por proveedor/modelo en USD por 1M tokens.
# Estos valores se usan para calcular el costo estimado de cada run.
pricing:
  claude-sonnet-4-6:
    input: 3.00
    output: 15.00
    cache_write: 3.75
    cache_read: 0.30
  claude-opus-4-8:
    input: 5.00
    output: 25.00
    cache_write: 6.25
    cache_read: 0.50
  claude-haiku-4-5-20251001:
    input: 1.00
    output: 5.00
    cache_write: 1.25
    cache_read: 0.10
  gpt-4o:
    input: 5.00
    output: 15.00
  gpt-4o-mini:
    input: 0.15
    output: 0.60
  deepseek-v4-flash:
    input: 0.14
    output: 0.28
  gemini-2.5-pro:
    input: 1.25
    output: 10.00
  gemini-2.5-flash:
    input: 0.30
    output: 2.50
  gemini-2.5-flash-lite:
    input: 0.10
    output: 0.40

# Presupuesto diario de tokens por proyecto.
# El dashboard muestra un gauge y emite warnings cuando se supera warning_threshold.
budgets:
  default_daily_budget_usd: 5.00
  warning_threshold: 0.80
